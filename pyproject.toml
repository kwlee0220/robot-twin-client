[project]
name = "robot-twin-client"
version = "0.1.0"
description = "Robot twin HTTP client and a pick sequence example (user guide 4.9)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
robot-twin-pick = "robot_twin_client.pick_n_place:main"
# 물체를 다른 물체 위에 쌓는다. 물리가 있는 백엔드가 필요하다 (mock 은 얹히지 않는다).
robot-twin-stack = "robot_twin_client.stack:main"
# peg 을 다른 고정물로 옮겨 꽂는다. **트윈만 쓴다** — ROS 의존이 없다.
# 펑션베이 기준이라 기본 포트가 8803 이다.
robot-twin-peg = "robot_twin_client.peg_in_hole:main"
# 쌓기를 **학습 데이터 에피소드로** 모은다 — `stack` 을 세션·에피소드 경계로 감싼다.
# ⚠️ 경계만 찍는다. 실제로 담는 `rdfp_collect` launch 와 rosbag 이 따로 떠 있어야 한다.
robot-twin-collect = "robot_twin_client.collect:main"
# MCP 서버. `mcp` extra 를 설치해야 동작한다 (`uv sync --extra mcp`).
robot-twin-mcp = "robot_twin_client.mcp_server:main"

[project.optional-dependencies]
# 클라이언트(`RobotTwinClient`)와 예제는 표준 라이브러리만 쓴다. MCP SDK 는 의존성이
# 무거우므로(pydantic/starlette/uvicorn) extra 로 분리해, 클라이언트만 쓰는 쪽이
# 그 비용을 지지 않게 한다.
mcp = [
    "mcp>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_twin_client"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 참고: ROS2 를 source 한 쉘에서는 PYTHONPATH 를 통해 /opt/ros/.../launch_pytest
# 플러그인이 venv 안까지 자동 로드되어 yaml 누락으로 충돌한다. `.env` 의
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 을 uv 가 픽업하도록 다음 중 하나로 실행한다.
#   uv run --env-file .env pytest
# 또는 쉘에 `export UV_ENV_FILE=.env` 를 등록하면 `uv run pytest` 도 그대로 동작한다.
